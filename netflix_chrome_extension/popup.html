<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakFlow</title><style>body{font:14px system-ui;width:300px;padding:14px;background:#101827;color:#eef4fc}h3{margin:0 0 10px}input{width:100%;box-sizing:border-box;padding:9px;margin:5px 0 10px;border-radius:8px;border:1px solid #38516d;background:#0b1421;color:white}button{width:100%;padding:10px;border:0;border-radius:8px;background:#91baff;font-weight:700}small{color:#9aabc0;line-height:1.5}</style><h3>SpeakFlow Netflix Saver</h3><label>SpeakFlow URL</label><input id="url" placeholder="https://your-app.onrender.com"><label>同期トークン</label><input id="token" type="password" placeholder="任意（サーバー設定と同じ値）"><button id="save">設定を保存</button><p id="status"></p><small>Netflix再生中に字幕をクリックすると保存できます。字幕が検出されない場合は、字幕付近に表示される「＋保存」ボタンを使ってください。</small><script src="popup.js"></script></html>
